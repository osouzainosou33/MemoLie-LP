name: Deploy

# mainにマージされたら自動でFirebase Hostingへ本番公開する（D5）。
# 「デプロイし忘れて中身が空/古いまま」事故（2026-06の404事故）の再発防止。
#
# 必要なSecret（Settings → Secrets and variables → Actions）:
#   FIREBASE_SERVICE_ACCOUNT_MEMOLIE
#     Firebaseコンソール → プロジェクトの設定 → サービスアカウント →
#     「新しい秘密鍵の生成」でJSONをダウンロードし、中身を丸ごとこのSecretに貼る。
#     （権限は Firebase Hosting 管理者相当。JSONはSecret登録後ローカルから削除する）

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (static generate)
        run: npm run generate

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEMOLIE }}
          channelId: live
          projectId: memolie
